<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {{ page.title | default: site.title | default: 'Tongseok Lim' | escape }}
  </title>

  {% if site.description %}
  <meta name="description" content="{{ site.description | escape }}">
  {% endif %}

  <!-- Existing site stylesheet -->
  {{ '/assets/css/style.css' | relative_url }}

  <!-- Self-contained photo layout -->
  <style>
    .home-photo-gallery {
      --photo-gap: 12px;
      --photo-radius: 10px;

      display: grid;
      grid-template-columns: minmax(0, 0.78fr) minmax(0, 1fr);
      align-items: stretch;
      gap: var(--photo-gap);

      width: 100%;
      max-width: 760px;
      margin: 24px auto 30px;
      box-sizing: border-box;
    }

    .home-photo-gallery__left {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: var(--photo-gap);
      min-width: 0;
    }

    .home-photo-gallery__landscape,
    .home-photo-gallery__portrait {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border-radius: var(--photo-radius);
      background: #f3f3f3;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    /* Show both landscape photos without cropping. */
    .home-photo-gallery__landscape {
      aspect-ratio: 4 / 3;
    }

    .home-photo-gallery img {
      display: block;
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;
      max-width: none;

      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    .home-photo-gallery__landscape img {
      object-fit: contain;
    }

    /*
     * Keep the bottom of the portrait visible.
     * Crop the excess background from the top.
     */
    .home-photo-gallery__portrait img {
      object-fit: cover;
      object-position: center bottom;
    }

    /* Basic fallback layout for the page content. */
    .homepage-wrapper {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 20px;
      box-sizing: border-box;
    }

    .homepage-content {
      min-width: 0;
      overflow-wrap: break-word;
    }

    .homepage-footer {
      margin: 36px 0 20px;
      text-align: center;
      font-size: 0.85rem;
      color: #666;
    }

    /* Mobile: place the portrait first. */
    @media (max-width: 600px) {
      .homepage-wrapper {
        padding: 0 16px;
      }

      .home-photo-gallery {
        --photo-gap: 10px;

        grid-template-columns: minmax(0, 1fr);
        max-width: 380px;
        margin: 20px auto 26px;
      }

      .home-photo-gallery__portrait {
        grid-row: 1;
        aspect-ratio: 75 / 88;
      }

      .home-photo-gallery__left {
        grid-row: 2;
      }
    }
  </style>
</head>

<body>
  <div class="homepage-wrapper">

    <!-- Homepage photo gallery -->
    <div class="home-photo-gallery">

      <!-- Left: two landscape photos -->
      <div class="home-photo-gallery__left">

        <div class="home-photo-gallery__landscape">
          {{ '/assets/home-landscape-1.jpg' | relative_url }}
        </div>

        <div class="home-photo-gallery__landscape">
          {{ '/assets/home-landscape-2.jpg' | relative_url }}
        </div>

      </div>

      <!-- Right: large portrait photo -->
      <div class="home-photo-gallery__portrait">
        {{ '/assets/home-portrait.jpg' | relative_url }}
      </div>

    </div>

    <!-- Existing page content -->
    <main class="homepage-content">
      {{ content }}
    </main>

    <footer class="homepage-footer">
      &copy; {{ 'now' | date: '%Y' }} Tongseok Lim
    </footer>

  </div>
</body>
</html>
