<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
  {{ site.stylesheet }}
  {{ site.head }}
</head>
<body>

<!-- Responsive Horizontal Photos Banner with adjustable cropping -->
<header class="banner">
<!-- Three-photo layout -->
<div class="home-photo-gallery">

  <!-- Two landscape photos on the left -->
  <div class="home-photo-gallery__left">
    <div class="home-photo-gallery__landscape">
      {{ '/assets/home-landscape-1.jpg' | relative_url }}
    </div>

    <div class="home-photo-gallery__landscape">
      {{ '/assets/home-landscape-2.jpg' | relative_url }}
    </div>
  </div>

  <!-- Large portrait photo on the right -->
  <div class="home-photo-gallery__portrait">
    {{ '/assets/home-portrait.jpg' | relative_url }}
  </div>

</div>
</header>
  
  <!-- Page content -->
  <main class="page-content" aria-label="Content">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="wrapper">
      <p>© {{ site.time | date: "%Y" }} {{ site.title }}</p>
    </div>
  </footer>

<script>
// Apply vertical cropping from data-position
document.querySelectorAll('.banner-images img').forEach(img => {
  const pos = img.getAttribute('data-position') || '0%';
  img.style.objectPosition = `center ${pos}`;
});
</script>
  
</body>
</html>
