<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title | default: site.title | default: 'Tongseok Lim' | escape }}</title>

  <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body>
  <div class="wrapper">

    <!-- Homepage photo gallery -->
    <div class="home-photo-gallery">

      <!-- Left: two landscape photos -->
      <div class="home-photo-gallery__left">

        <div class="home-photo-gallery__landscape">
          /assets/home-landscape-1.jpg
        </div>

        <div class="home-photo-gallery__landscape">
          /assets/home-landscape-2.jpg
        </div>

      </div>

      <!-- Right: large portrait photo -->
      <div class="home-photo-gallery__portrait">
        /assets/home-portrait.jpg
      </div>

    </div>

    <!-- Existing page content -->
    <main class="page-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      &copy; {{ 'now' | date: '%Y' }} Tongseok Lim
    </footer>

  </div>
</body>
</html>
